<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project 0 — Becoming Friends with Your Camera</title>
  <meta name="description" content="CS 180 Project 0: Becoming Friends with Your Camera." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --blue:#2028b4;
      --white:#fff;
      --line:rgba(32,40,180,.28);
      --pad:clamp(18px,2.2vw,34px);
      --serif:"Instrument Serif", "Times New Roman", serif;
      --sans:"Inter", Arial, sans-serif;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--white);
      color:var(--blue);
      font-family:var(--sans);
    }
    a{color:inherit;text-decoration:none}

    .page{
      width:min(1760px,100%);
      min-height:100vh;
      margin:0 auto;
      overflow:hidden;
    }
    .topbar{
      display:flex;
      justify-content:space-between;
      gap:24px;
      padding:18px var(--pad) 12px;
      border-bottom:1px solid var(--line);
      font-size:clamp(12px,.82vw,14px);
      line-height:1.25;
      text-transform:uppercase;
    }
    .back:hover{opacity:.5}

    .hero{
      min-height:0;
      padding:clamp(36px,5vw,80px) var(--pad) clamp(30px,3vw,48px);
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      border-bottom:1px solid var(--line);
    }
    .eyebrow{
      margin:0;
      font-size:clamp(14px,1vw,18px);
      text-transform:uppercase;
    }
    h1{
      max-width:1500px;
      margin:clamp(22px,2.5vw,40px) 0 0;
      font-family:var(--serif);
      font-size:clamp(70px,10.5vw,180px);
      font-weight:400;
      line-height:.88;
      letter-spacing:-.045em;
    }
    .content{
      display:grid;
      grid-template-columns:minmax(180px,.55fr) 1.45fr;
      gap:clamp(32px,7vw,120px);
      padding:clamp(54px,7vw,110px) var(--pad);
    }
    .content h2{
      margin:0;
      font-family:var(--serif);
      font-size:clamp(20px,1.7vw,30px);
      font-weight:400;
    }
    .video-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:clamp(10px,1vw,18px);
    }
    .video-grid video{
      display:block;
      width:100%;
      aspect-ratio:16/9;
      object-fit:cover;
      background:#000;
    }
    .video-note{
      max-width:900px;
      margin:18px 0 0;
      font-size:clamp(13px,.9vw,16px);
      line-height:1.4;
    }

    @media (max-width:760px){
      .topbar{align-items:flex-start}
      .content{grid-template-columns:1fr}
      .video-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>Neil Chen · CS 180 · Fall 2026</div>
      <a class="back" href="index.html">← Back</a>
    </header>

    <section class="hero">
      <p class="eyebrow">Project 0</p>
      <h1>Becoming Friends<br>with Your Camera</h1>
    </section>

    <section class="content">
      <h2>Part 3 →</h2>
      <div class="part-media">
        <div class="video-grid">
          <video controls playsinline preload="metadata">
            <source src="assets/videos/projects/project-0/dolly-zoom-01.mp4" type="video/mp4">
            Your browser does not support embedded video.
          </video>
          <video controls playsinline preload="metadata">
            <source src="assets/videos/projects/project-0/dolly-zoom-02.mp4" type="video/mp4">
            Your browser does not support embedded video.
          </video>
        </div>
        <p class="video-note">
          Filmed on an iPhone 14 Pro in Xinjiang, China. The vehicle moved forward as the camera zoomed out, creating a dolly-zoom effect. Exact focal-length values were not recorded.
        </p>
      </div>
    </section>
  </main>
</body>
</html>
